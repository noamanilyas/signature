    <div class="modal" id="rulesConditionsModal" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="rulesConditionsModalH">Select Users/Groups</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form action="">
              <!-- ------------- Section 1 ------------- -->

              <div class="form-group">
                <label class="btn btn-secondary active">
                  <input type="checkbox" id="applySig" aria-label="Checkbox for following text input" /> Apply Signature
                  (On/Off)
                </label>
                <!-- <h3>Apply Signature</h3>
                <label class="switch">
                  <input type="checkbox" checked />
                  <span class="slider round"></span>
                </label> -->
              </div>

              <!-- ------------- Section 2 ------------- -->

              <div class="form-group">
                <label>Only add this Signature if subject contains</label>
                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <div class="input-group-text">
                      <input id="addSig_Status" type="checkbox" aria-label="Checkbox for following text input" />
                    </div>
                  </div>
                  <input id="addSig_Text" type="text" class="form-control" aria-label="Text input with checkbox" />
                </div>
                <div style="margin-left: 30px">
                  <label class="btn btn-secondary active">
                    <input id="addSig_TextRM" type="checkbox" aria-label="Checkbox for following text input" /> Remove this
                    text from this Subject
                  </label>
                </div>
              </div>

              <!-- ------------- Section 3 ------------- -->

              <div class="form-group">
                <label>Don't add Signature if message contains</label>
                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <div class="input-group-text">
                      <input id="DA_Status" type="checkbox" aria-label="Don't add Signature if message contains" />
                    </div>
                  </div>
                  <input type="text" id="DA_Text" class="form-control" aria-label="Text input with checkbox" />
                </div>
                <div style="margin-left: 30px">
                  <label>In:</label>
                  <br />
                  <div class="btn-group btn-group-toggle" data-toggle="buttons">
                    <label class="btn btn-secondary active">
                      <input id="DA_Anywhere" type="radio" name="options" autocomplete="off" /> Anywhere in email trail
                    </label>
                    <label class="btn btn-secondary">
                      <input id="DA_RecentEmail" type="radio" name="options" autocomplete="off" /> Only the most recent email
                    </label>
                  </div>
                  <br />

                  <label>If this Signature isn't added:</label>
                  <br />
                  <div class="btn-group btn-group-toggle" data-toggle="buttons">
                    <label class="btn btn-secondary active">
                      <input type="radio" name="options" id="DA_ProcessNext" autocomplete="off" /> Process the next Signature
                    </label>
                    <label class="btn btn-secondary">
                      <input type="radio" name="options" id="DA_DontProcessNext" autocomplete="off" /> Don't process the next
                      Signature
                    </label>
                  </div>
                </div>
              </div>

              <!-- ------------- Section 4 ------------- -->

              <div class="form-group">
                <label>If this Signature is added:</label>
                <br />
                <div class="btn-group btn-group-toggle" data-toggle="buttons">
                  <label class="btn btn-secondary active">
                    <input type="radio" name="options" id="SigAdded_ProcessNext" autocomplete="off" checked /> Process the
                    next Signature
                  </label>
                  <label class="btn btn-secondary">
                    <input type="radio" name="options" id="SigAdded_DontProcessNext" autocomplete="off" /> Don't process the
                    next Signature
                  </label>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary saveRulesConditions" data-dismiss="modal" aria-label="Close">
              Save changes
            </button>
