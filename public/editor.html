<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Signature Designer</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />

    <!-- <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"

    ></script> -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
      integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>

    <script type="text/javascript" src="https://livejs.com/live.js"></script>
    <style type="text/css">
      body {
        background-color: #61a733;
      }
      .title {
        color: #ffffff;
      }
      .sig-name {
        width: 20% !important;
      }
    </style>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="./stylesheets/style.css" />
    <link rel="stylesheet" href="./stylesheets/indexstyle.css" />

    <!-- <link rel="stylesheet" href="@sweetalert2/theme-borderless/borderless.css" /> -->

    <script src="//cdn.jsdelivr.net/npm/sweetalert2@10"></script>
  </head>
  <body>
    <!-- <center> -->
    <nav class="navbar navbar-dark bg-dark nav-right">
      <a class="navbar-brand" href="#">
        <img src="/images/logo.png" height="45" alt="" />
      </a>
      <input
        autocomplete="off"
        class="form-control mr-sm-2 sig-name n-item"
        type="text"
        id="signatureName"
        placeholder="Signature Name"
        aria-label="name"
      />
      <button type="button" id="saveSignature" class="n-item btn btn-success">Save</button>
      <button id="backIndexBtn" class="n-item btn btn-danger">Close</button>
      <!-- <button type="button" class="n-item btn btn-warning">Import</button> -->
      <button
        type="button"
        class="btn btn-warning n-item"
        data-toggle="modal"
        data-target="#importModal"
        data-whatever="@mdo"
      >
        Import
      </button>
      <button type="button" class="btn btn-warning" data-toggle="modal" data-target="#previewModel" data-whatever="@mdo">
        Preview
      </button>
    </nav>
    <h1 align="center" class="title">Signature Designer</h1>
    <div class="panel"></div>

    <div class="centered">
      <div style="display: table-row">
        <div style="display: table-cell">
          <div id="drop" class="drop"></div>
        </div>
      </div>
    </div>

    <div class="panelPreview"></div>
    <div class="delDrop"><h4 align="center" class="title">Delete Item</h4></div>

    <div class="modal" id="propertiesModel" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="propertiesModelLabel">Properties</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <section id="propTabs">
              <div class="row">
                <div class="col-2">
                  <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
                    <ul id="tabListUL" class="nav nav-tabs" style="overflow-y: auto">
                      <li>
                        <a
                          class="nav-link"
                          id="v-tableProps-side"
                          data-toggle="pill"
                          href="#v-tableProps-body"
                          role="tab"
                          aria-controls="v-tableProps-body"
                          aria-expanded="true"
                          >Table Props</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-labelIcon-side"
                          data-toggle="pill"
                          href="#v-labelIcon-body"
                          role="tab"
                          aria-controls="v-labelIcon-body"
                          aria-expanded="true"
                          >Label Icon</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link active"
                          id="v-imageSource-side"
                          data-toggle="pill"
                          href="#v-imageSource-body"
                          role="tab"
                          aria-controls="v-imageSource-body"
                          aria-expanded="true"
                          >Image Source</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-hyperlink-side"
                          data-toggle="pill"
                          href="#v-hyperlink-body"
                          role="tab"
                          aria-controls="v-hyperlink-body"
                          aria-expanded="true"
                          >Hyperlink</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-text-side"
                          data-toggle="pill"
                          href="#v-text-body"
                          role="tab"
                          aria-controls="v-text-body"
                          aria-expanded="true"
                          >Text Props</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-background-side"
                          data-toggle="pill"
                          href="#v-background-body"
                          role="tab"
                          aria-controls="v-background-body"
                          aria-expanded="true"
                          >Background</a
                        >
                      </li>
                      <!-- <li>
                        <a
                          class="nav-link"
                          id="v-visibility-side"
                          data-toggle="pill"
                          href="#v-visibility-body"
                          role="tab"
                          aria-controls="v-visibility-body"
                          aria-expanded="true"
                          >Visibility</a
                        >
                      </li> -->
                      <li>
                        <a
                          class="nav-link"
                          id="v-alignment-side"
                          data-toggle="pill"
                          href="#v-alignment-body"
                          role="tab"
                          aria-controls="v-alignment-body"
                          aria-expanded="true"
                          >Alignment</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-border-side"
                          data-toggle="pill"
                          href="#v-border-body"
                          role="tab"
                          aria-controls="v-border-body"
                          aria-expanded="true"
                          >Border</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-padding-side"
                          data-toggle="pill"
                          href="#v-padding-body"
                          role="tab"
                          aria-controls="v-padding-body"
                          aria-expanded="true"
                          >Padding</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-size-side"
                          data-toggle="pill"
                          href="#v-size-body"
                          role="tab"
                          aria-controls="v-size-body"
                          aria-expanded="true"
                          >Element Size</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-render-side"
                          data-toggle="pill"
                          href="#v-render-body"
                          role="tab"
                          aria-controls="v-render-body"
                          aria-expanded="true"
                          >Render</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-orientation-side"
                          data-toggle="pill"
                          href="#v-orientation-body"
                          role="tab"
                          aria-controls="v-orientation-body"
                          aria-expanded="true"
                          >Orientation</a
                        >
                      </li>
                      <li>
                        <a
                          class="nav-link"
                          id="v-socialMediaIcon-side"
                          data-toggle="pill"
                          href="#v-socialMediaIcon-body"
                          role="tab"
                          aria-controls="v-socialMediaIcon-body"
                          aria-expanded="true"
                          >Social Media Icon</a
                        >
                      </li>
                    </ul>
                  </div>
                </div>
                <div class="col-10" style="overflow: auto; max-height: 240px">
                  <div class="tab-content" id="v-pills-tabContent">
                    <div class="tab-pane fade" id="v-labelIcon-body" role="tabpanel" aria-labelledby="v-labelIcon-side">
                      <!-- Here is a content for tab labelIcon. -->
                      <form>
                        <div class="form-group">
                          <label for="formGroupExampleInput2">Background</label>
                          <input type="text" class="form-control" placeholder="#000000" />
                        </div>
                        <div class="form-group">
                          <label for="formGroupExampleInput2">Foreground</label>
                          <input type="text" class="form-control" placeholder="#000000" />
                        </div>
                        <div class="form-group">
                          <label for="formGroupExampleInput2">Width</label>
                          <input type="text" class="form-control" placeholder="0 px" />
                        </div>
                        <div class="form-group">
                          <label for="formGroupExampleInput2">Height</label>
                          <input type="text" class="form-control" placeholder="0 px" />
                        </div>
                        <div class="form-group">
                          <label for="formGroupExampleInput2">Corner Radius</label>
                          <input type="text" class="form-control" placeholder="0 px" />
                        </div>
                      </form>
                    </div>
                    <div
                      class="tab-pane fade imageSource"
                      id="v-imageSource-body"
                      role="tabpanel"
                      aria-labelledby="v-imageSource-side"
                    >
                      <!-- Here is a content for tab imageSource. -->
                    </div>
                    <div
                      class="tab-pane fade hyperlink"
                      id="v-hyperlink-body"
                      role="tabpanel"
                      aria-labelledby="v-hyperlink-side"
                    >
                      <!-- Here is a content for tab hyperlink. -->
                    </div>
                    <div class="tab-pane fade text" id="v-text-body" role="tabpanel" aria-labelledby="v-text-side">
                      <!-- Here is a content for tab text. -->
                    </div>
                    <div
                      class="tab-pane fade background"
                      id="v-background-body"
                      role="tabpanel"
                      aria-labelledby="v-background-side"
                    >
                      <!-- Here is a content for tab background. -->
                    </div>
                    <div
                      class="tab-pane fade visibility"
                      id="v-visibility-body"
                      role="tabpanel"
                      aria-labelledby="v-visibility-side"
                    >
                      <!-- Here is a content for tab visibility. -->
                    </div>
                    <div
                      class="tab-pane fade alignment"
                      id="v-alignment-body"
                      role="tabpanel"
                      aria-labelledby="v-alignment-side"
                    >
                      <!-- Here is a content for tab alignment. -->
                    </div>
                    <div class="tab-pane fade borderDiv" id="v-border-body" role="tabpanel" aria-labelledby="v-border-side">
                      <!-- Here is a content for tab border. -->
                    </div>
                    <div
                      class="tab-pane fade paddingDiv"
                      id="v-padding-body"
                      role="tabpanel"
                      aria-labelledby="v-padding-side"
                    >
                      <!-- Here is a content for tab padding. -->
                    </div>
                    <div class="tab-pane fade size" id="v-size-body" role="tabpanel" aria-labelledby="v-size-side">
                      <!-- Here is a content for tab size. -->
                    </div>
                    <div class="tab-pane fade" id="v-render-body" role="tabpanel" aria-labelledby="v-render-side">
                      <!-- Here is a content for tab render. -->
                    </div>
                    <div class="tab-pane fade" id="v-orientation-body" role="tabpanel" aria-labelledby="v-orientation-side">
                      <!-- Here is a content for tab orientation. -->
                      <form>
                        <div class="form-group">
                          <label for="formGroupExampleInput">Orientation</label>
                          <div class="btn-toolbar" role="toolbar" aria-label="Toolbar with button groups">
                            <div class="btn-group" role="group" aria-label="Basic example">
                              <button type="button" class="btn btn-secondary">Vertical</button>
                              <button type="button" class="btn btn-secondary">Horizontal</button>
                            </div>
                          </div>
                        </div>
                      </form>
                    </div>
                    <div
                      class="tab-pane fade"
                      id="v-socialMediaIcon-body"
                      role="tabpanel"
                      aria-labelledby="v-socialMediaIcon-side"
                    >
                      <!-- Here is a content for tab socialMediaIcon. -->
                    </div>
                    <div
                      class="tab-pane fade tableProps"
                      id="v-tableProps-body"
                      role="tabpanel"
                      aria-labelledby="v-tableProps-side"
                    >
                      <!-- Here is a content for tab tableProps. -->
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="previewModel" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="previewModelLabel">Preview</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="panelPreview2"></div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="importModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="importModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="importModalLabel">Signature Source</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form>
              <!-- <div class="form-group">
                <label for="recipient-name" class="col-form-label">Recipient:</label>
                <input type="text" class="form-control" id="recipient-name" />
              </div> -->
              <div class="form-group">
                <label for="message-text" class="col-form-label">Table HTML</label>
                <textarea class="form-control" id="htmlText"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="importSource">Import</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="nameModel" tabindex="-1" role="dialog" aria-labelledby="nameModelLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="nameModelLabel">Signature Name</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form>
              <!-- <div class="form-group">
              <label for="recipient-name" class="col-form-label">Recipient:</label>
              <input type="text" class="form-control" id="recipient-name" />
            </div> -->
              <div class="form-group">
                <!-- <label for="message-text" class="col-form-label">Enter Name</label> -->
                <input class="form-control" id="nameModelInput" />
                <label id="nameEmptyError" class="form-check-label" style="color: red; display: none">
                  Invalid name. Please enter a valid name
                </label>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="nameModelSave">Save</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="closeModel" tabindex="-1" role="dialog" aria-labelledby="closeModelLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="closeModellLabel">Close Signature</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form>
              <!-- <div class="form-group">
              <label for="recipient-name" class="col-form-label">Recipient:</label>
              <input type="text" class="form-control" id="recipient-name" />
            </div> -->
              <div class="form-group">
                <label for="message-text" class="col-form-label">You have unsaved changes.</label>
                <!-- <input class="form-control" id="nameModelInput"></input>
                <label id="nameEmptyError" class="form-check-label" style="color: red; display: none">
                  Invalid name. Please enter a valid name
                </label> -->
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="closeModelDSave">Don't Save</button>
            <button type="button" class="btn btn-primary" id="closeModelSave">Save</button>
          </div>
        </div>
      </div>
    </div>

    <img id="previewImgElem" style="display: none" src="" />

    <script type="text/javascript" src="./javascripts/tabsJs/border.js"></script>

    <script type="text/javascript" src="./javascripts/tabsJs/size.js"></script>
    <script type="text/javascript" src="./javascripts/tabsJs/background.js"></script>
    <script type="text/javascript" src="./javascripts/tabsJs/text.js"></script>
    <script type="text/javascript" src="./javascripts/tabsJs/image.js"></script>
    <script type="text/javascript" src="./javascripts/modal.js"></script>
    <script type="text/javascript" src="./javascripts/buildPanel.js"></script>

    <script type="text/javascript" src="./javascripts/sigHTML.js"></script>
    <script type="text/javascript" src="./javascripts/script.js"></script>
  </body>
</html>
