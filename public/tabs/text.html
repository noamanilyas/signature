<form id="text-form">
  <div class="form-group">
    <label for="text-text">Text</label>
    <!-- <input type="text" class="form-control" id="text-text" placeholder="Your text here!" /> -->
    <textarea type="text" class="form-control jqte-test" id="text-text" placeholder="Your text here!"></textarea>
  </div>
  <div class="form-group">
    <label for="formGroupExampleInput">Font Family</label>
    <select class="form-control" id="text-fontFamily">
      <option value="">Inherit</option>
      <option value="Calibri">Calibri</option>
      <option value="Ariel">Ariel</option>
      <option value="Arial Black">Arial Black</option>
      <option value="Century Gothic">Century Gothic</option>
      <option value="Comic Sans MS">Comic Sans MS</option>
      <option value="Courier New">Courier New</option>
      <option value="Georgia">Georgia</option>
      <option value="Impact">Impact</option>
      <option value="Tahoma">Tahoma</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Trebuchet MS">Trebuchet MS</option>
      <option value="Verdana">Verdana</option>
    </select>
  </div>
  <div class="form-group">
    <label for="formGroupExampleInput">Font Size (px)</label>
    <input type="text" class="form-control" id="text-fontSize" placeholder="Inherit" />
  </div>

  <div class="form-group">
    <label for="textWrapping">Text Wrap</label>
    <div class="btn-toolbar" role="toolbar" aria-label="Toolbar with button groups">
      <div class="btn-group mr-2" role="group" aria-label="First group">
        <button type="button" id="text-wrap" title="Wrap" class="btn btn-secondary">
          <span>Wrap</span>
        </button>
        <button type="button" id="text-no-wrap" title="No-Wrap" class="btn btn-secondary">
          <span>No-Wrap</span>
        </button>
      </div>
    </div>
  </div>
