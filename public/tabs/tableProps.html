<form id="table-form">
  <div class="form-group">
    <label for="table-cols">Columns</label>
    <input id="table-cols" type="number" min="1" class="form-control" placeholder="1" />
  </div>
  <div class="form-group">
    <label for="table-rows">Rows</label>
    <input id="table-rows" type="number" min="1" class="form-control" placeholder="1" />
  </div>
  <div class="form-group">
    <!-- <label for="table-rows">Rows</label> -->
    <button id="btn-update-rows-cols" class="form-control btn btn-success" />Update</button>
  </div>
  <div class="form-group">
    <label for="table-colSpan">Column Span</label>
    <input id="table-colSpan" type="number" min="1" class="form-control" placeholder="1" />
  </div>
  <div class="form-group">
    <label for="table-rowSpan">Row Span</label>
    <input id="table-rowSpan" type="number" min="1" class="form-control" placeholder="1" />
  </div>
