<form id="size-form">
  <div class="sz-list">
  <div class="sz-row" data-axis="width">
    <div class="sz-icon w"></div>
    <div class="sz-label">Width</div>
    <div class="sz-seg">
      <button type="button" class="sz-mode active" data-mode="auto">Auto</button>
      <button type="button" class="sz-mode" data-mode="fixed">Fixed</button>
    </div>
    <div class="sz-end">
      <div class="sz-auto">Fits content</div>
      <div class="sz-field"><input id="size-width" type="number" class="form-control" placeholder="0" aria-label="Width" /><span>px</span></div>
    </div>
  </div>
  <div class="sz-row" data-axis="height">
    <div class="sz-icon h"></div>
    <div class="sz-label">Height</div>
    <div class="sz-seg">
      <button type="button" class="sz-mode active" data-mode="auto">Auto</button>
      <button type="button" class="sz-mode" data-mode="fixed">Fixed</button>
    </div>
    <div class="sz-end">
      <div class="sz-auto">Fits content</div>
      <div class="sz-field"><input id="size-height" type="number" class="form-control" placeholder="0" aria-label="Height" /><span>px</span></div>
    </div>
  </div>
  </div>
</form>
