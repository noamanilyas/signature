<form id="border-form">
  <label for="formGroupExampleInput">All</label>
  <div class="row">
    <div class="col">
      <div class="form-group">
        <select class="form-control" id="border-type-all">
          <option value="">Inherit</option>
          <option value="solid">Solid</option>
          <option value="dashed">Dashed</option>
          <option value="dotted">Dotted</option>
        </select>
      </div>
    </div>
    <div class="col">
      <div class="form-group">
        <input type="number" min="1" class="form-control" id="border-size-all" placeholder="Size" />
      </div>
    </div>
    <div class="col">
      <div class="form-group">
        <input type="text" class="form-control" id="border-color-all" placeholder="Color" />
      </div>
    </div>
  </div>
