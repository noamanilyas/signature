<form id="padding-form">

      <div class="pad-label">All sides</div>
      <div class="pad-field"><input type="number" id="padding-all" class="form-control" placeholder="0" /><span>px</span></div>
    </label>

      <div class="form-check">

    <label class="pad-row" for="padding-right">

    <label class="pad-row" for="padding-left">
