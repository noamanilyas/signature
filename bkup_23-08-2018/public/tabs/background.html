<form id="background-form">
  <div class="form-group">
    <label for="formGroupExampleInput">Background</label>
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="backgroundRadios"
        id="background-none"
        value="none"
        checked
      />
      <label class="form-check-label" for="gridRadios1">None</label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="backgroundRadios"
        id="background-color"
        value="color"
      />
      <label class="form-check-label" for="gridRadios2">Color</label>
      <input type="text" class="form-control" id="background-colorInput" placeholder="Transparent" />
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="backgroundRadios"
        id="background-imagefile"
        value="file"
      />
      <label class="form-check-label" for="gridRadios3">Image file</label>
      <input type="file" class="form-control-file" id="background-imageFile" />
    </div>
  </div>
</form>
