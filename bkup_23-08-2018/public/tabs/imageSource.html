<form id="image-form">
  <div class="form-group">
    <div class="form-check">
      <input class="form-check-input" type="radio" name="imageRadios" id="image-url" value="url" />
      <label class="form-check-label" for="gridRadios2">Image URL</label>
      <input type="text" class="form-control" id="image-imageURL" placeholder="Transparent" />
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="imageRadios" id="image-upload" value="upload" />
      <label class="form-check-label" for="gridRadios3">Image file</label>
      <input type="file" class="form-control-file" id="image-imageFile" />
    </div>
  </div>
</form>
